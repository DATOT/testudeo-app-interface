[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[profile.debug]
opt-level = "s"
lto = "thin" 

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
btleplug = "0.13.5"
tokio = {version = "1.54.1", features = ["full"]}
axum = {version = "0.8.9", features = ["ws"]}
futures-util = "0.3.34"
fastembed = "6.0.2"
sherpa-onnx = "2.0.1"
unicode-segmentation = "1.13.3"
hf-hub = "1.0.0"
usearch = "2.26.6"
reqwest = "0.13.5"
ort = "2.0.0-rc.13"
docling-core = "1.101.0"
docling = "1.101.0"
tracing = "0.1.44"
uuid = "1.29.0"
